[package]
name = "nucypher-core-uniffi"
version = "0.14.0"
edition = "2021"
authors = ["NuCypher <dev@nucypher.com>"]
description = "UniFFI bindings for nucypher-core"
license = "GPL-3.0-or-later"

[dependencies]
uniffi = { version = "0.29.1", features = ["bindgen"] }
nucypher-core = { path = "../nucypher-core" }
ferveo = { package = "ferveo-pre-release", version = "0.3.0" }
ferveo-common = { package = "ferveo-common-pre-release", version = "0.1.1" }
thiserror = "1.0"

[build-dependencies]
uniffi = { version = "0.29.1", features = ["build"] }

[dev-dependencies]
rand = "0.8"

[lib]
crate-type = ["cdylib", "rlib"]

[package.metadata.uniffi.bindings]
generate = ["kotlin", "swift"]
kotlin_package_name = "com.nucypher.core"
swift_module_name = "NuCypherCore"
